
services:
  server-1:
    build:
      context: .
      dockerfile: infra/server/Dockerfile
    container_name: distributed_log_server_1
    volumes:
      - .:/app
    ports:
      - "2221:22"
      - "9991:9999/udp"
      - "8080:8080"
    privileged: true

  server-2:
    build:
      context: .
      dockerfile: infra/server/Dockerfile
