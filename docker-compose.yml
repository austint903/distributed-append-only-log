
services:
  server-1:
    build:
      context: .
      dockerfile: infra/server/Dockerfile
    container_name: distributed_log_server_1
    volumes:
      - .:/app
      - ./docker-data:/app/cmake-build-dev-server
    ports:
      - "2222:22"
      - "9991:9999/udp"
      - "8080:8080"
    privileged: true

  server-2:
    build:
      context: .
      dockerfile: infra/server/Dockerfile
    container_name: distributed_log_server_2
    volumes:
      - .:/app
      - ./docker-data:/app/cmake-build-dev-server
    ports:
      - "2221:22"
      - "9992:9999/udp"
      - "8081:8080"
    privileged: true
    command: bash -c "/usr/sbin/sshd && exec /app/cmake-build-dev-server/server"

  server-3:
    build:
      context: .
      dockerfile: infra/server/Dockerfile
    container_name: distributed_log_server_3
    volumes:
      - .:/app
      - ./docker-data:/app/cmake-build-dev-server
    ports:
      - "2223:22"
      - "9993:9999/udp"
      - "8083:8080"
    privileged: true
    command: bash -c "/usr/sbin/sshd && exec /app/cmake-build-dev-server/server"
