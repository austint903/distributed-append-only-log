    volumes:
      - .:/app
    ports:
      - "2222:22"
      - "9992:9999/udp"
      - "8082:8080"
    privileged: true

  server-3:
    build:
      context: .
      dockerfile: infra/server/Dockerfile
    container_name: distributed_log_server_3
    volumes:
      - .:/app
    ports:
      - "2223:22"
      - "9993:9999/udp"
      - "8083:8080"
    privileged: true
